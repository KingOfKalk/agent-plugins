<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Deck title]</title>
<style>
/* Tokens: see presentation-designer/references/tokens.md. Set data-mode and data-palette on <body>. */
:root {
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --bg: #FFFFFF; --surface: #EEEEEE; --text: #111111; --muted: #555555;
  --border: #AFAFAF; --separator: #E2E2E2; --accent: #0A55B5;
  --success: #1E7A3A; --warning: #8A5300; --error: #C0262D;
  --series-1: #0A55B5; --series-2: #EB6834; --series-3: #1BAF7A; --series-4: #6250D6; --context: #AFAFAF;
  --radius: 4px;
  /* read mode sizes */
  --fs-l: 96px; --lh-l: 104px; --fs-n: 32px; --lh-n: 48px; --fs-s: 24px; --lh-s: 32px;
  --footer-y: 1000px;
  --body-h: 672px; --row-h-2: 312px; --row-h-3: 192px; --source-h: 48px;
}
body[data-palette="dark"] {
  --bg: #141414; --surface: #222222; --text: #F2F2F2; --muted: #A3A3A3;
  --border: #555555; --separator: #2E2E2E; --accent: #6CA8FF;
  --success: #5CC98A; --warning: #F2B33D; --error: #FF7A7A;
  --series-1: #6CA8FF; --series-2: #D95926; --series-3: #199E70; --series-4: #9085E9; --context: #555555;
}
body[data-palette="mono"] {
  --bg: #FFFFFF; --surface: #FFFFFF; --text: #000000; --muted: #4D4D4D;
  --border: #000000; --separator: #BDBDBD; --accent: #000000;
  --success: #000000; --warning: #000000; --error: #000000; --radius: 0;
  --series-1: #000000; --series-2: #4D4D4D; --series-3: #000000; --series-4: #4D4D4D; --context: #BDBDBD;
}
body[data-mode="talk"], body[data-mode="both"] {
  --fs-n: 48px; --lh-n: 56px; --fs-s: 32px; --lh-s: 40px;
  --footer-y: 992px;
  --body-h: 664px; --row-h-2: 304px; --row-h-3: 184px; --source-h: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: #000; font-family: var(--sans); color: var(--text); overflow: hidden; }

/* Fixed 1920 x 1080 canvas, scaled as a whole by the script. */
.slide {
  position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
  background: var(--bg); transform-origin: 0 0; display: none; overflow: hidden;
  padding: 72px 72px 120px 72px;
  font-size: var(--fs-n); line-height: var(--lh-n);
}
.slide.active { display: block; }

/* Header */
.headline { font-size: var(--fs-l); line-height: var(--lh-l); font-weight: 700; white-space: nowrap; }
.subheadline { margin-top: 16px; color: var(--muted); }
.body { margin-top: 48px; }
/* Vertical alignment of the body (spec field "align"): add .center to .body.
   The script centers it with a top padding rounded down to the 8px grid. */
.body.center { height: var(--body-h); }
.body.grid.center { align-content: start; }
/* SourceNote (DS 5.3): add .has-source to the slide; the body ends 16px above the note */
.has-source .body.center { height: calc(var(--body-h) - var(--source-h)); }
/* Hatch for mono status strips and mono chart context (tokens.md) */
.hatch { background-image: repeating-linear-gradient(45deg, var(--text) 0 4px, transparent 4px 16px); }

/* 12-column grid: 104px columns, 48px gutters */
.grid { display: grid; grid-template-columns: repeat(12, 104px); column-gap: 48px; row-gap: 48px; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-6 { grid-column: span 6; }
.span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }

/* Text sizes */
.large { font-size: var(--fs-l); line-height: var(--lh-l); }
.small { font-size: var(--fs-s); line-height: var(--lh-s); }
.muted { color: var(--muted); }
.bold { font-weight: 700; }
.accent { color: var(--accent); font-weight: 700; }

/* Type styles: never italic or strikethrough, also not from browser defaults */
em, i, cite, address, var, dfn { font-style: normal; }
s, del, strike { text-decoration: none; }
/* Links (DS 5.5): text color; underlined unless the text is the URL itself (.url) */
a { color: inherit; font-weight: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
a.url { text-decoration: none; }

/* Boxes (DS 4.1 / 6.1) */
.card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 24px; }
.card .title { font-weight: 700; margin-bottom: 16px; }
.card .text { font-size: var(--fs-s); line-height: var(--lh-s); }
.card.accent-box { border: 4px solid var(--accent); padding: 22px; }

/* Label above a value (small, muted) */
.label { font-size: var(--fs-s); line-height: var(--lh-s); color: var(--muted); }

/* Rows (DS 4.3): add .rows-2 or .rows-3 to .rows; label | text as 4 | 8 */
.rows { display: flex; flex-direction: column; gap: 48px; }
.row { display: grid; grid-template-columns: 512px 1fr; column-gap: 48px; align-items: center; padding: 0 24px;
  background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); }
.rows-2 .row { height: var(--row-h-2); } .rows-3 .row { height: var(--row-h-3); }
.row .row-label { font-weight: 700; }
.row.focus { border: 4px solid var(--accent); padding: 0 22px; }
.row.focus .row-label { color: var(--accent); }

/* Split (DS 3.5 6 | 6, DS 3.6 4 | 8 / 8 | 4): 2px divider centered in the gutter; set --split-at to the gutter center */
.split { position: relative; --split-at: 887px; }
.split.split-4-8 { --split-at: 583px; } .split.split-8-4 { --split-at: 1191px; }
.split::before { content: ""; position: absolute; left: var(--split-at); top: 0; bottom: 0; width: 2px; background: var(--border); }
.split .label + * { margin-top: 16px; }

/* Closing (DS 2.6): one takeaway, block vertically centered, left aligned */
.closing { position: absolute; left: 72px; right: 72px; top: 72px; } /* top set by the script, centered and snapped to 8px */

/* Code (DS 10.1) */
.code-caption { font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 700; margin-bottom: 8px; }
pre.code {
  background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 24px;
  font-family: var(--mono); font-size: var(--fs-s); line-height: var(--lh-s); white-space: pre; overflow: hidden;
}
pre.code .kw { color: var(--accent); } pre.code .cm { color: var(--muted); }

/* Lists (DS 5.1) */
ul.list, ol.list { padding-left: 48px; } ul.list li + li, ol.list li + li { margin-top: 16px; }

/* Source note (DS 5.3) */
.source { position: absolute; left: 72px; right: 72px; top: calc(var(--footer-y) - 72px); font-size: var(--fs-s); line-height: var(--lh-s); color: var(--muted); }

/* Footer (DS 1.2) */
.footer {
  position: absolute; left: 72px; right: 72px; top: var(--footer-y);
  display: flex; justify-content: space-between;
  font-size: var(--fs-s); line-height: var(--lh-s); color: var(--muted);
}

/* Speaker notes: hidden; press N to show */
.notes { display: none; }
#notes-panel {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; max-height: 30vh; overflow: auto;
  background: #111; color: #EEE; font: 16px/24px var(--sans); padding: 16px 24px; white-space: pre-wrap; z-index: 10;
}
body.show-notes #notes-panel { display: block; }

/* Print / PDF: one slide per page, unscaled */
@page { size: 1920px 1080px; margin: 0; }
@media print {
  body { background: none; overflow: visible; }
  .slide { display: block !important; position: relative; transform: none !important; page-break-after: always; break-after: page; }
  #notes-panel { display: none !important; }
}
</style>
</head>
<!-- data-mode: read | talk | both; data-palette: light | dark | mono -->
<body data-mode="read" data-palette="light">

<!-- DS 2.1 TitleSlide: no page number -->
<section class="slide" data-title-slide>
  <div style="position:absolute; left:72px; top:440px;">
    <div class="headline">[Deck title]</div>
    <div class="subheadline">[One-line subtitle]</div>
  </div>
  <div class="footer"><span>[Name] | [date] | v0.1</span><span></span></div>
  <aside class="notes">[Speaker notes]</aside>
</section>

<!-- DS 3.6 SplitUneven example -->
<section class="slide has-source">
  <div class="headline">[Headline]</div>
  <div class="subheadline">[Subheadline: one full takeaway sentence.]</div>
  <div class="body grid center">
    <div class="span-8">[Chart or content]</div>
    <div class="span-4 card accent-box">
      <div class="large accent">[__]</div>
      <div class="text">[label]</div>
    </div>
  </div>
  <div class="source">Source: [who], [when]</div>
  <div class="footer"><span class="deck-title"></span><span class="page-num"></span></div>
  <aside class="notes">[Speaker notes]</aside>
</section>

<!-- Appendix slides: add data-appendix to number them A1, A2 ... -->

<div id="notes-panel"></div>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var title = document.title;
  var main = slides.filter(function (s) { return !s.hasAttribute('data-appendix'); });
  var appendixIndex = 0;

  // Footer: deck title and "n / total"; title slide counts as 1 but shows no number; appendix A1, A2 ...
  slides.forEach(function (s) {
    var t = s.querySelector('.deck-title'); if (t) t.textContent = s.hasAttribute('data-appendix') ? title + ' | Appendix' : title;
    var p = s.querySelector('.page-num'); if (!p || s.hasAttribute('data-title-slide')) return;
    p.textContent = s.hasAttribute('data-appendix') ? 'A' + (++appendixIndex) : (main.indexOf(s) + 1) + ' / ' + main.length;
  });

  var current = 0;
  var start = (parseInt(location.hash.slice(1), 10) || 1) - 1; // read before layout passes touch the hash
  function fit() {
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var x = (window.innerWidth - 1920 * scale) / 2, y = (window.innerHeight - 1080 * scale) / 2;
    slides.forEach(function (s) { s.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')'; });
  }
  function show(i) {
    current = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === current); });
    var n = slides[current].querySelector('.notes');
    document.getElementById('notes-panel').textContent = n ? n.textContent.trim() : '';
    if (location.hash !== '#' + (current + 1)) history.replaceState(null, '', '#' + (current + 1));
  }
  document.addEventListener('keydown', function (e) {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) >= 0) { show(current + 1); e.preventDefault(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) >= 0) { show(current - 1); e.preventDefault(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('show-notes');
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('#notes-panel')) show(current + (e.clientX < window.innerWidth / 3 ? -1 : 1)); });
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function () { show(parseInt(location.hash.slice(1), 10) - 1 || 0); });

  // Vertical centering on the 8px grid: .body.center gets a top padding, .closing a top position,
  // both rounded down to a multiple of 8. Call window.layoutDeck() again after changing mode or content.
  window.layoutDeck = function () {
    var keep = current;
    slides.forEach(function (s, k) {
      show(k);
      s.querySelectorAll('.body.center').forEach(function (el) {
        el.style.paddingTop = '0px'; el.style.height = 'auto';
        var content = el.offsetHeight;
        el.style.height = '';
        var free = el.offsetHeight - content;
        el.style.paddingTop = Math.max(0, Math.floor(free / 16) * 8) + 'px';
      });
      s.querySelectorAll('.closing').forEach(function (el) {
        var area = parseInt(getComputedStyle(document.body).getPropertyValue('--footer-y'), 10) - 40 - 72;
        el.style.top = (72 + Math.max(0, Math.floor((area - el.offsetHeight) / 16) * 8)) + 'px';
      });
    });
    show(keep);
  };

  // Layout check for the builder. Run headless with "?check" in the URL; results land in <pre id="layout-check">.
  //   safe area / overflow: nothing outside the margins, no text overflowing its box
  //   grid:  layout boxes (body children, grid items, cards, rows, code, header, footer, source) on the 8px grid,
  //          allowing the 4px that 2px strokes add and a box's own strokes; data-grid="off" exempts data-sized content (bars, images)
  //   type:  only the mode's three sizes, weights 400 / 700, no italic, only the sans and mono stacks
  //   color: text, fill and stroke colors only from the active palette and chart colors
  //   data-check="off" exempts an element and its children from all checks (e.g. on-screen controls)
  function hex(c) {
    var m = c.match(/rgba?\(([^)]+)\)/); if (!m) return null;
    var p = m[1].split(',').map(function (v) { return parseFloat(v); });
    if (p.length > 3 && p[3] === 0) return null;
    return '#' + p.slice(0, 3).map(function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); }).join('').toUpperCase();
  }
  function tokens() {
    var cs = getComputedStyle(document.body), get = function (n) { return cs.getPropertyValue(n).trim(); };
    var colors = {};
    ['--bg', '--surface', '--text', '--muted', '--border', '--separator', '--accent', '--success', '--warning', '--error',
     '--series-1', '--series-2', '--series-3', '--series-4', '--context'].forEach(function (n) { colors[get(n).toUpperCase()] = true; });
    var norm = function (f) { return f.replace(/["'\s]/g, '').toLowerCase(); };
    return { colors: colors, sizes: [get('--fs-s'), get('--fs-n'), get('--fs-l')].map(parseFloat),
             families: [norm(get('--sans')), norm(get('--mono'))], norm: norm };
  }
  var BOX = '.body > *, .grid > *, .rows > *, .headline, .subheadline, .footer, .source, .card, .row, pre.code, .closing, .code-caption';
  // 8px grid; a 2px stroke on both sides of a box shifts sizes and following positions by 4, so 4 is accepted too
  function onGrid(v) { return Math.abs(v - Math.round(v / 4) * 4) < 0.5; }
  function sizeOk(v, strokes) { return onGrid(v) || onGrid(v - strokes); }

  window.checkLayout = function () {
    var problems = [], keep = current, t = tokens();
    slides.forEach(function (s, k) {
      show(k);
      var r = s.getBoundingClientRect(), scale = r.width / 1920;
      var at = 'slide ' + (k + 1) + ': ';
      s.querySelectorAll('*').forEach(function (el) {
        if (el.closest('.notes') || el.closest('[data-check="off"]')) return;
        var b = el.getBoundingClientRect(); if (!b.width && !b.height) return;
        var cs = getComputedStyle(el);
        var name = el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.split(' ').join('.') : '');
        var left = (b.left - r.left) / scale, top = (b.top - r.top) / scale, w = b.width / scale, h = b.height / scale;

        // grid
        if (el.matches(BOX) && !el.closest('[data-grid="off"]')) {
          var sx = parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
          var sy = parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
          if (!onGrid(left) || !onGrid(top) || !sizeOk(w, sx) || !sizeOk(h, sy))
            problems.push(at + 'grid: ' + name + ' at ' + Math.round(left) + ',' + Math.round(top) + ' size ' + Math.round(w) + 'x' + Math.round(h));
        }
        if (el.closest('svg') && el.tagName.toLowerCase() !== 'svg') return;

        // type: only for elements that hold text themselves
        var ownText = Array.prototype.some.call(el.childNodes, function (n) { return n.nodeType === 3 && n.textContent.trim(); });
        if (ownText) {
          var fs = parseFloat(cs.fontSize);
          if (t.sizes.indexOf(fs) < 0) problems.push(at + 'type: ' + name + ' font-size ' + fs + 'px');
          if (['400', '700'].indexOf(cs.fontWeight) < 0) problems.push(at + 'type: ' + name + ' font-weight ' + cs.fontWeight);
          if (cs.fontStyle !== 'normal') problems.push(at + 'type: ' + name + ' font-style ' + cs.fontStyle);
          if (t.families.indexOf(t.norm(cs.fontFamily)) < 0) problems.push(at + 'type: ' + name + ' font-family ' + cs.fontFamily);
          var c = hex(cs.color); if (c && !t.colors[c]) problems.push(at + 'color: ' + name + ' text ' + c);
        }

        // color: fills and strokes
        var bg = hex(cs.backgroundColor); if (bg && !t.colors[bg]) problems.push(at + 'color: ' + name + ' fill ' + bg);
        ['Top', 'Right', 'Bottom', 'Left'].forEach(function (side) {
          if (parseFloat(cs['border' + side + 'Width']) > 0 && cs['border' + side + 'Style'] !== 'none') {
            var bc = hex(cs['border' + side + 'Color']);
            if (bc && !t.colors[bc]) problems.push(at + 'color: ' + name + ' stroke ' + bc);
          }
        });

        // safe area and overflow (footer may sit in the bottom band)
        if (el.closest('.footer')) return;
        var right = left + w, bottom = top + h;
        var limit = 961;
        var src = s.querySelector('.source');
        if (src && !el.closest('.source')) limit = (src.getBoundingClientRect().top - r.top) / scale - 15;
        if (left < 71 || top < 71 || right > 1849 || bottom > limit) problems.push(at + name + ' outside safe area');
        if (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 8) problems.push(at + name + ' overflows its box');
      });
    });
    show(keep);
    // one line per problem, duplicates folded
    return problems.filter(function (p, i) { return problems.indexOf(p) === i; });
  };

  fit();
  window.layoutDeck();
  show(start);
  if (/[?&]check\b/.test(location.search)) {
    var out = document.createElement('pre'); out.id = 'layout-check';
    var found = window.checkLayout(); out.setAttribute('data-problems', found.length);
    out.textContent = found.length ? found.join('\n') : 'OK'; out.style.display = 'none';
    document.body.appendChild(out);
  }
})();
</script>
</body>
</html>
